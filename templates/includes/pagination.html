{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="Paginación">
  {% if page_obj.has_previous %}
    <a class="btn btn-ghost btn-sm" href="{% querystring page=page_obj.previous_page_number %}">&larr; Anterior</a>
  {% else %}
    <span class="btn btn-ghost btn-sm disabled">&larr; Anterior</span>
  {% endif %}
  <span class="pagination-info">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a class="btn btn-ghost btn-sm" href="{% querystring page=page_obj.next_page_number %}">Siguiente &rarr;</a>
  {% else %}
    <span class="btn btn-ghost btn-sm disabled">Siguiente &rarr;</span>
  {% endif %}
</nav>
{% endif %}
