{% with url_name=request.resolver_match.url_name %}
<header class="navbar">
  <div class="container navbar-inner">
    <a class="brand" href="{% url 'articles:home' %}">Article<span>Hub</span></a>
    <button class="nav-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="nav-menu" data-nav-toggle>
      <span></span><span></span><span></span>
    </button>
    <nav class="nav-menu" id="nav-menu">
      <a href="{% url 'articles:home' %}" class="{% if url_name == 'home' %}active{% endif %}">Inicio</a>
      {% if user.is_authenticated %}
        <a href="{% url 'articles:dashboard' %}" class="{% if url_name == 'dashboard' %}active{% endif %}">Dashboard</a>
        <a href="{% url 'articles:article_create' %}" class="{% if url_name == 'article_create' %}active{% endif %}">Crear artículo</a>
        {% if user_is_editor %}
          <a href="{% url 'articles:editor_dashboard' %}" class="{% if url_name == 'editor_dashboard' or url_name == 'editor_review' %}active{% endif %}">Panel editorial</a>
        {% endif %}
        <a href="{% url 'articles:search' %}" class="{% if url_name == 'search' %}active{% endif %}">Buscar</a>
        <a href="{% url 'accounts:profile' %}" class="{% if url_name == 'profile' %}active{% endif %}">Mi cuenta</a>
        <form method="post" action="{% url 'accounts:logout' %}" class="nav-logout">
          {% csrf_token %}
          <button type="submit" class="btn btn-ghost btn-sm">Cerrar sesión</button>
        </form>
      {% else %}
        <a href="{% url 'articles:category_list' %}" class="{% if url_name == 'category_list' or url_name == 'category_detail' %}active{% endif %}">Categorías</a>
        <a href="{% url 'articles:search' %}" class="{% if url_name == 'search' %}active{% endif %}">Buscar</a>
        <a href="{% url 'accounts:login' %}" class="{% if url_name == 'login' %}active{% endif %}">Iniciar sesión</a>
        <a href="{% url 'accounts:register' %}" class="btn btn-primary btn-sm">Registrarse</a>
      {% endif %}
    </nav>
  </div>
</header>
{% endwith %}
